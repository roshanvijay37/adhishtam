name: Deploy site to GitHub Pages

# The repo holds more than the website — brand masters, the profile deck,
# internal notes. Serving the repo root would publish all of it under the
# client's own domain. This workflow assembles ONLY the site and publishes
# that, so the source material is never reachable over HTTP.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a half-finished one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the published site
        run: |
          set -euo pipefail
          mkdir -p _site

          # Everything the website actually needs, and nothing else.
          cp index.html about.html services.html portfolio.html blog.html contact.html _site/
          cp 404.html robots.txt sitemap.xml _site/
          cp -r assets _site/

          # Docs live next to the things they document (assets/anim/README.md),
          # which is right for maintainers and wrong for the server.
          find _site -name '*.md' -delete

          # Stops Pages running the output through Jekyll.
          touch _site/.nojekyll

          # CNAME is only present once the custom domain's DNS is live.
          # Adding it before DNS resolves would redirect the working
          # github.io URL to a domain that does not answer yet.
          if [ -f CNAME ]; then
            cp CNAME _site/
            echo "Custom domain: $(cat CNAME)"
          else
            echo "No CNAME — publishing to the github.io URL."
          fi

      - name: Fail if the shared header or footer has drifted
        run: |
          set -euo pipefail
          # Six standalone pages means six copies of the nav and footer. There
          # is no template engine to keep them in sync, so this does it: edit
          # one and forget the rest, and the build stops instead of shipping a
          # site whose menu changes depending on which page you are on.
          fail=0
          for part in nav footer; do
            ref=""; refpage=""
            for f in index about services portfolio blog contact; do
              case "$part" in
                nav)    sed -n '/<nav class="nav__links"/,/<\/nav>/p' "$f.html" > /tmp/blk ;;
                footer) sed -n '/<footer class="footer">/,/<\/footer>/p' "$f.html" > /tmp/blk ;;
              esac
              [ -s /tmp/blk ] || { echo "::error::$part block not found in $f.html"; fail=1; continue; }
              # the current-page markers are supposed to differ
              sed -i 's/ is-active//g; s/ aria-current="page"//g' /tmp/blk
              sum=$(sha1sum /tmp/blk | cut -d' ' -f1)
              if [ -z "$ref" ]; then ref="$sum"; refpage="$f"
              elif [ "$sum" != "$ref" ]; then
                echo "::error::$part in $f.html has drifted from $refpage.html"
                fail=1
              fi
            done
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "Header and footer are identical across all six pages."

      - name: Fail if source material leaked into the artifact
        run: |
          set -euo pipefail
          leaked=0
          for p in brand company-profile portfolio _archive .git .htaccess; do
            if [ -e "_site/$p" ]; then echo "::error::$p must not be published"; leaked=1; fi
          done
          # Recursive, not just the root — assets/ carries its own docs.
          if find _site -name '*.md' | grep -q .; then
            echo "::error::markdown files must not be published:"
            find _site -name '*.md'
            leaked=1
          fi
          [ "$leaked" -eq 0 ] || exit 1
          echo "Clean. Published tree:"
          find _site -mindepth 1 -type d -printf '  %P/\n' | sort
          echo "  ($(find _site -type f | wc -l) files, $(du -sh _site | cut -f1) total)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
