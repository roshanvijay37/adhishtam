<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <title>Film grain tile</title>
  <!-- Tileable monochrome noise. Laid over the whole page at very low opacity
       it stops the large flat greens from banding on cheap phone panels, and
       reads as print texture rather than as an effect. stitchTiles keeps the
       edges seamless when it repeats. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="200" height="200" filter="url(#grain)"/>
</svg>
