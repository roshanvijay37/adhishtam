<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <title>Molten gold</title>
  <!-- Three gold masses warped by static turbulence, then drifting past each
       other. The displacement filter is applied to STATIC content and the
       animation lives on the groups outside it — so each blob is rasterised
       once and every frame after that is a composited transform. Animating
       baseFrequency instead would look similar and re-run the filter on every
       frame, which is exactly the kind of thing that melts a mid-range phone. -->
  <defs>
    <radialGradient id="gf-a" cx="50%" cy="45%" r="55%">
      <stop offset="0%"   stop-color="#ffeec2" stop-opacity=".95"/>
      <stop offset="55%"  stop-color="#c9a961" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#b8943e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gf-b" cx="45%" cy="55%" r="58%">
      <stop offset="0%"   stop-color="#e8ce8e" stop-opacity=".8"/>
      <stop offset="60%"  stop-color="#b8943e" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#8d6f2c" stop-opacity="0"/>
    </radialGradient>

    <filter id="gf-w1" x="-35%" y="-35%" width="170%" height="170%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="78" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="gf-w2" x="-35%" y="-35%" width="170%" height="170%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="62" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="gf-w3" x="-35%" y="-35%" width="170%" height="170%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="95" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <style>
    .m { transform-origin: 300px 300px; }
    .m1 { animation: drift1 38s ease-in-out infinite alternate; }
    .m2 { animation: drift2 52s ease-in-out infinite alternate; }
    .m3 { animation: drift3 64s ease-in-out infinite alternate; }
    @keyframes drift1 {
      from { transform: translate(-9%, 4%) scale(1)    rotate(0deg); opacity: .85 }
      to   { transform: translate(11%, -7%) scale(1.18) rotate(26deg); opacity: 1 }
    }
    @keyframes drift2 {
      from { transform: translate(8%, -6%) scale(1.12) rotate(0deg); opacity: .6 }
      to   { transform: translate(-10%, 8%) scale(.92)  rotate(-32deg); opacity: .95 }
    }
    @keyframes drift3 {
      from { transform: translate(2%, 9%)  scale(.95) rotate(0deg); opacity: .5 }
      to   { transform: translate(-6%, -9%) scale(1.25) rotate(18deg); opacity: .8 }
    }
    @media (prefers-reduced-motion: reduce) {
      .m1, .m2, .m3 { animation: none; }
    }
  </style>

  <g class="m m3"><g filter="url(#gf-w3)"><ellipse cx="300" cy="300" rx="230" ry="180" fill="url(#gf-b)"/></g></g>
  <g class="m m2"><g filter="url(#gf-w2)"><ellipse cx="300" cy="300" rx="185" ry="205" fill="url(#gf-a)"/></g></g>
  <g class="m m1"><g filter="url(#gf-w1)"><ellipse cx="300" cy="300" rx="205" ry="150" fill="url(#gf-a)"/></g></g>
</svg>
