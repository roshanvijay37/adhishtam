  /* Self-contained: a 404 is served in place of ANY missing URL, at any depth,
     and the browser resolves relative paths against the requested URL — not

    min-height:100svh;display:grid;place-content:center;justify-items:center;
    gap:1.6rem;padding:2rem;text-align:center;

  }
  svg.mark{width:88px}
  h1{
    font-family:"Syne",system-ui,sans-serif;font-weight:800;
    font-size:clamp(3.4rem,14vw,7rem);line-height:.9;letter-spacing:-.03em;
    background:linear-gradient(100deg,#b8943e,#e8ce8e 48%,#b8943e);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h2{font-family:"Syne",system-ui,sans-serif;font-weight:800;font-size:clamp(1.2rem,4vw,1.7rem);letter-spacing:-.02em}
  p{color:rgba(255,254,244,.62);max-width:44ch}
  a{
    display:inline-flex;align-items:center;gap:.7rem;margin-top:.6rem;
    padding:1rem 2rem;border-radius:999px;text-decoration:none;color:#061710;
    background:linear-gradient(100deg,#b8943e,#e8ce8e 48%,#b8943e);
    font-size:.8rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    transition:box-shadow .4s,transform .4s;
  }
  a:hover{box-shadow:0 14px 40px -12px rgba(201,169,97,.55);transform:translateY(-2px)}
